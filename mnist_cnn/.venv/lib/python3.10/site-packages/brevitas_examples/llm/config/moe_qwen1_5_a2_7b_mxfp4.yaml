# Eager GPT-OSS MoE MXFP4 quantization configuration.
#
# GPT-OSS uses stacked expert weights and functional matmul/bmm projections.

model: openai/gpt-oss-20b
dataset: wikitext2
dtype: auto
eval: false
seed: 0
seqlen: 64
nsamples: 8

# Enable MXFP4 functional quantization for the stacked MoE projections.
functional_quantization: all
custom_quantizer: src/brevitas_examples/llm/config/moe_qwen1_5_a2_7b_mxfp4.py:gpt_oss_mxfp4

# Dynamic MXFP4 input quantization covers functional expert activations.
input_bit_width: 4
input_quant_format: float_ocp_e2m1
input_quant_type: sym
input_scale_precision: po2_scale
input_scale_type: dynamic
input_quant_granularity: per_group
input_group_size: 32

# MXFP4 weight quantization uses 32-element shared-exponent groups.
weight_bit_width: 4
weight_quant_format: float_ocp_e2m1
weight_quant_type: sym
weight_quant_granularity: per_group
weight_group_size: 32
weight_param_method: stats
weight_scale_precision: po2_scale
scale_rounding_func_type: floor
