# Full-parameter FSDP2 fine-tuning example for Qwen3.5-9B.
# From the repository root:
# accelerate launch \
#   --config_file src/brevitas_examples/llm/config/qwen3_5_9b_fsdp2_accelerate.yaml \
#   src/brevitas_examples/llm/main.py \
#   --config src/brevitas_examples/llm/config/qwen3_5_9b_fsdp2_full_finetune.yaml

# Model and data
model: Qwen/Qwen3.5-9B
dataset: wikitext2
bos_preprocessing: sequence
dtype: bfloat16
seqlen: 2048
nsamples: 256
nsamples_rot_calibration: 256
seed: 0

# Quantize first, then optimize every parameter without rotation parametrizations.
rotation: null
optimize_rotations: false
fine_tune: true
custom_trainer: src/brevitas_examples/llm/config/full_parameter_trainer.py:full_parameter_finetuning

# Transformers TrainingArguments
output_dir: ./outputs/qwen3_5_9b_fsdp2_full_finetune
max_steps: 100
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
weight_decay: 0.1
lr_scheduler_type: cosine
warmup_steps: 0.03
max_grad_norm: 1.0
bf16: true
logging_steps: 1
save_strategy: "no"
report_to: none
torch_empty_cache_steps: 1

# Skip evaluation and export in this training-only example.
eval: false
few_shot_eval: null
checkpoint_name: null
export_target: null
